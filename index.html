<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>한·미 국채 금리 대시보드</title><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>body{font-family:system-ui,-apple-system,Segoe UI,Noto Sans KR,sans-serif;margin:0;background:#f5f6f8;color:#171717}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}h1{margin:0}.muted{color:#6b7280}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px}.wide{grid-column:1/-1}button,select{padding:9px 12px;border:1px solid #d1d5db;border-radius:9px;background:#fff}table{width:100%;border-collapse:collapse}th,td{padding:10px 6px;border-bottom:1px solid #eee;text-align:right}th:first-child,td:first-child{text-align:left}.up{color:#b91c1c}.down{color:#1d4ed8}.big{font-size:28px;font-weight:700}.err{color:#b91c1c;margin-top:12px}.schedule-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.schedule-list{margin:12px 0 0;padding:0;list-style:none}.schedule-list li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #eee}.done{color:#9ca3af}.next{font-weight:700}.tag{font-size:12px;padding:2px 7px;border-radius:999px;background:#eef2ff}@media(max-width:760px){.grid,.schedule-grid{grid-template-columns:1fr}.wide{grid-column:auto}table{font-size:12px}}</style></head>
<body><div class="wrap"><div class="top"><div><h1>한·미 국채 금리 대시보드</h1><div class="muted">한국은행 ECOS · U.S. Treasury</div></div><div style="text-align:right"><div id="topDates" class="muted" style="margin-bottom:8px;font-size:13px">데이터 불러오는 중...</div><select id="days"><option value="30">30일</option><option value="90">90일</option><option value="365">1년</option></select> <button id="refresh">새로고침</button></div></div>
<div class="grid"><div class="card"><b>30년물</b><div class="big" id="kr30">-</div><div>한국</div><br><div class="big" id="us30">-</div><div>미국</div></div><div class="card"><b>한국·미국 기준금리</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px"><div><div class="muted">한국은행 기준금리</div><div class="big" id="krPolicyRate">-</div><div class="muted" id="krPolicyDate" style="font-size:12px">조회 중</div></div><div><div class="muted">미 연준 기준금리</div><div class="big" id="usPolicyRate">-</div><div class="muted" id="usPolicyDate" style="font-size:12px">Federal Funds Target Range 상단</div></div></div></div>
<div class="card wide"><b>현재 금리</b><table><thead><tr><th>만기</th><th>한국</th><th>전일비</th><th>미국</th><th>전일비</th><th>한-미</th></tr></thead><tbody id="tbody"></tbody></table></div><div class="card wide"><b>2026년 통화정책 일정</b><div class="schedule-grid"><div><h3>미국 FOMC</h3><ul class="schedule-list" id="fomcList"></ul></div><div><h3>한국 금통위</h3><ul class="schedule-list" id="bokList"></ul></div></div></div><div class="card wide"><b>최근 30년 한국·미국 기준금리 추이</b><div class="muted" style="font-size:12px;margin:6px 0 12px">미국은 Federal Funds Target Range 상단값 기준</div><canvas id="policyHistory"></canvas></div></div><div id="updated" class="muted" style="margin-top:12px"></div><div id="err" class="err"></div></div>
<script>
(function(){
const $=id=>document.getElementById(id),mats=["1Y","2Y","3Y","5Y","10Y","20Y","30Y"];let chart=null;const fmt=v=>v==null?"-":Number(v).toFixed(3)+"%",bp=v=>v==null?"-":(v>0?"+":"")+Number(v).toFixed(1)+"bp",cls=v=>v>0?"up":v<0?"down":"";
const fomc=[["2026-01-27","1월 27–28일"],["2026-03-17","3월 17–18일"],["2026-04-28","4월 28–29일"],["2026-06-16","6월 16–17일"],["2026-07-28","7월 28–29일"],["2026-09-15","9월 15–16일"],["2026-10-27","10월 27–28일"],["2026-12-08","12월 8–9일"]],bok=[["2026-01-15","1월 15일"],["2026-02-26","2월 26일"],["2026-04-10","4월 10일"],["2026-05-28","5월 28일"],["2026-07-16","7월 16일"],["2026-08-27","8월 27일"],["2026-10-22","10월 22일"],["2026-11-26","11월 26일"]];
function drawSchedules(){const today=new Date();today.setHours(0,0,0,0);function draw(id,arr){const el=$(id);el.innerHTML="";let next=false;for(const[iso,label]of arr){const d=new Date(iso+"T00:00:00");let c="",b="";if(d<today){c="done";b='<span class="tag">완료</span>'}else if(!next){c="next";b='<span class="tag">다음</span>';next=true}el.insertAdjacentHTML("beforeend",`<li class="${c}"><span>${label}</span>${b}</li>`)}}draw("fomcList",fomc);draw("bokList",bok)}
async function load(){const err=$("err"),btn=$("refresh"),daysEl=$("days");err.textContent="";btn.disabled=true;$("topDates").textContent="데이터 불러오는 중...";try{const url="/api/yields?days="+encodeURIComponent(daysEl.value)+"&_="+Date.now();const r=await fetch(url,{method:"GET",cache:"no-store",headers:{"Accept":"application/json"}});const text=await r.text();let j;try{j=JSON.parse(text)}catch(_){throw Error("API 응답이 JSON이 아닙니다 (HTTP "+r.status+")")}if(!r.ok)throw Error(j.error||"API HTTP "+r.status);$("kr30").textContent=fmt(j.latest&&j.latest.kr&&j.latest.kr["30Y"]?j.latest.kr["30Y"].value:null);$("us30").textContent=fmt(j.latest&&j.latest.us&&j.latest.us["30Y"]?j.latest.us["30Y"].value:null);$("tbody").innerHTML="";for(const m of mats){const k=(j.latest&&j.latest.kr&&j.latest.kr[m])||{},u=(j.latest&&j.latest.us&&j.latest.us[m])||{},s=k.value!=null&&u.value!=null?(k.value-u.value)*100:null;$("tbody").insertAdjacentHTML("beforeend",`<tr><td>${m}</td><td>${fmt(k.value)}</td><td class="${cls(k.changeBp)}">${bp(k.changeBp)}</td><td>${fmt(u.value)}</td><td class="${cls(u.changeBp)}">${bp(u.changeBp)}</td><td>${bp(s)}</td></tr>`)}const kd=(j.latestDates&&j.latestDates.kr)||"-",ud=(j.latestDates&&j.latestDates.us)||"-";$("topDates").textContent=`데이터 기준일 · 한국 ${kd} / 미국 ${ud}`;$("updated").textContent=`국채 데이터 출처: 한국은행 ECOS / U.S. Treasury · 한국 ${kd} / 미국 ${ud}`;const pkr=(j.policyHistory&&j.policyHistory.kr)||[],pus=(j.policyHistory&&j.policyHistory.us)||[],kc=pkr.length?pkr[pkr.length-1]:null,uc=pus.length?pus[pus.length-1]:null;$("krPolicyRate").textContent=kc?Number(kc.value).toFixed(2)+"%":"-";$("krPolicyDate").textContent=kc?kc.date+" 기준":"조회 실패";$("usPolicyRate").textContent=uc?Number(uc.value).toFixed(2)+"%":"-";$("usPolicyDate").textContent=uc?((j.policyHistory&&j.policyHistory.usLabel)||"미국 기준금리")+" · "+uc.date:"조회 실패";if(j.errors&&j.errors.length)err.textContent=j.errors.join(" / ");const labels=[...new Set(pkr.map(x=>x.date).concat(pus.map(x=>x.date)))].sort();function step(series){let i=0,cur=null;return labels.map(d=>{while(i<series.length&&series[i].date<=d){cur=series[i].value;i++}return cur})}if(window.Chart&&labels.length){if(chart)chart.destroy();chart=new window.Chart($("policyHistory"),{type:"line",data:{labels:labels,datasets:[{label:"한국 기준금리",data:step(pkr),stepped:true,spanGaps:true,pointRadius:2},{label:(j.policyHistory&&j.policyHistory.usLabel)||"미국 기준금리",data:step(pus),stepped:true,spanGaps:true,pointRadius:2}]},options:{responsive:true,interaction:{mode:"index",intersect:false},scales:{x:{ticks:{maxTicksLimit:12}},y:{title:{display:true,text:"기준금리(%)"}}}}})}}catch(e){$("topDates").textContent="데이터 조회 실패";err.textContent="데이터 조회 오류: "+(e&&e.message?e.message:String(e));console.error(e)}finally{btn.disabled=false}}
function init(){$("refresh").addEventListener("click",load);$("days").addEventListener("change",load);drawSchedules();load()}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
})();
</script><!-- force-deploy-20260917-frontend-fix --></body></html>
